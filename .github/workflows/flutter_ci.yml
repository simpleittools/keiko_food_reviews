name: Flutter CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Clear Flutter Cache
      - run: flutter precache --force

      # Step 1: Check out your repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Set up Flutter (explicit Flutter version)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.6.0' # Specify your desired stable version

      # Step 3: Install dependencies
      - name: Install dependencies
        run: flutter pub get

      # Step 4: Analyze the code
      - name: Analyze code
        run: flutter analyze

      # Step 5: Run tests
      - name: Run tests
        run: flutter test